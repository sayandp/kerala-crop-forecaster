# Telegram Stage 1: one public channel, one post per day (all crops).
# ONE market per crop (Phase 6b: keep the post short), in dashboard order: cash crops, bananas,
# vegetables. Must be series of config/series.yaml; `commodity:` when the key is a product key.
crops:
  coconut:      [{market: Koduvayoor, variety: Big}]
  pepper:       [{market: Kannur, variety: Other}]
  rubber:       [{market: Kalpetta, variety: RSS-4}]
  arecanut:     [{market: Manjeswaram, variety: Other}]
  coffee:       [{market: Kalpetta, variety: Other}]
  ginger:       [{market: Kayamkulam, variety: Other}]
  banana:       [{market: Kayamkulam, variety: Nendran}]
  palayankodan: [{market: Kayamkulam, variety: Palayamthodan, commodity: banana}]
  poovan:       [{market: Palakkad, variety: Poovan, commodity: banana}]
  tapioca:      [{market: Payyannur, variety: Other}]
  tomato:       [{market: Kayamkulam, variety: Other}]
  onion:        [{market: Kayamkulam, variety: Big}]
  small_onion:  [{market: Kayamkulam, variety: Small, commodity: onion}]
  green_chilli: [{market: Kayamkulam, variety: Other}]
  bitter_gourd: [{market: Manjeswaram, variety: Bitter Gourd}]
  drumstick:    [{market: Kayamkulam, variety: Other}]
  cucumber:     [{market: Payyannur, variety: Other}]

# Up/down move alerts ("likely to rise > 3 % this week", bot digests) per crop. Default OFF.
# Turning one on is honoured ONLY if that crop's newest live verdict in promotion_log is "pass"
# (pre-registered test, reports/preregistration_e4a.md); otherwise it is refused and logged
# (cropcast.bot.moves.move_alerts_allowed). Banana is not judged (naive only).
move_alerts_enabled:
  coconut: false
  pepper: false
  rubber: false
  tapioca: false
repo_url: https://github.com/sayandp/kerala-crop-forecaster
