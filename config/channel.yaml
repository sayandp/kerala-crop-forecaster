# Telegram Stage 1: one public channel, one post per day (all crops).
# Markets shown per crop (must be series in config/series.yaml). 1-3 per crop.
crops:
  banana:
    - {market: Kayamkulam, variety: Nendran}
    - {market: Parassala, variety: Nendran}
    - {market: Chenkal VFPCK, variety: Nendran}
  coconut:
    - {market: Koduvayoor, variety: Big}
    - {market: Palakkad, variety: Coconut}
  pepper:
    - {market: Kannur, variety: Other}
    - {market: Manjeswaram, variety: Garbled Other}
  rubber:
    - {market: Kalpetta, variety: RSS-4}
    - {market: Pulpally, variety: Other}
  tapioca:
    - {market: Payyannur, variety: Other}
    - {market: Perumbavoor, variety: Tapioca}

# Up/down move alerts ("likely to rise > 3 % this week", bot digests) per crop. Default OFF.
# Turning one on is honoured ONLY if that crop's newest live verdict in promotion_log is "pass"
# (pre-registered test, reports/preregistration_e4a.md); otherwise it is refused and logged
# (cropcast.bot.moves.move_alerts_allowed). Banana is not judged (naive only).
move_alerts_enabled:
  coconut: false
  pepper: false
  rubber: false
  tapioca: false
repo_url: https://github.com/sayandp/kerala-crop-forecaster
