# Modelled series (commodity, market, variety) — canonical names as in prices_clean.
# Source: notebooks/eda.ipynb section 9 (usable rule: >= 2 years, < 20 % missing Mon-Sat days,
# alive in the last 30 days). Edit freely; features/train/backtest read this list.
# Changing it changes the model population: note it in the MLflow run (it is logged).
series:
  # banana (Nendran)
  - {commodity: banana, market: Kayamkulam, variety: Nendran}
  - {commodity: banana, market: Chenkal VFPCK, variety: Nendran}
  - {commodity: banana, market: Mookkannur VFPCK, variety: Nendran}
  - {commodity: banana, market: Parassala, variety: Nendran}
  - {commodity: banana, market: Thiruvaniyoor VFPCK, variety: Nendran}
  - {commodity: banana, market: Elamad VFPCK, variety: Nendran}
  - {commodity: banana, market: Kunnukara VFPCK, variety: Nendran}
  - {commodity: banana, market: Vengannore VFPCK, variety: Nendran}
  # coconut
  - {commodity: coconut, market: Koduvayoor, variety: Big}
  - {commodity: coconut, market: Palakkad, variety: Coconut}
  - {commodity: coconut, market: North Paravur, variety: Big}
  # pepper
  - {commodity: pepper, market: Kannur, variety: Other}
  - {commodity: pepper, market: Manjeswaram, variety: Garbled Other}
  - {commodity: pepper, market: North Paravur, variety: Garbled}
  # tapioca
  - {commodity: tapioca, market: Manjeswaram, variety: Other}
  - {commodity: tapioca, market: Payyannur, variety: Other}
  - {commodity: tapioca, market: Perumbavoor, variety: Tapioca}
  - {commodity: tapioca, market: North Paravur, variety: Other}
  # rubber
  - {commodity: rubber, market: Pulpally, variety: Other}  # provisional: 25.7 % missing
  # Kalpetta "Other" (to 2025-11-06) + "RSS-4" (from 2025-11-07) stitched by the accepted
  # variety alias (guard ratio +0.6 %). Added in Phase 2.5 by decision.
  - {commodity: rubber, market: Kalpetta, variety: RSS-4}

  # --- Phase 6b (approved 2026-10-09; coverage report: >= 2 yrs, < 20 % missing, alive) ---------
  # `crop:` = the product key used by the dashboard / bot / channel when one commodity holds
  # several products (banana varieties, big vs small onion); defaults to the commodity.
  # Ingest keeps ONLY these markets for the new commodities (ingest/mappings.py, Neon budget).
  # cash crops
  - {commodity: arecanut, market: Manjeswaram, variety: Other}
  - {commodity: arecanut, market: Payyannur, variety: Other}
  - {commodity: coffee, market: Kalpetta, variety: Other}
  - {commodity: ginger, market: Kayamkulam, variety: Other}
  - {commodity: ginger, market: Manjeswaram, variety: Green Ginger}
  # banana (not Nendran)
  - {commodity: banana, market: Kayamkulam, variety: Palayamthodan, crop: palayankodan}
  - {commodity: banana, market: Palakkad, variety: Poovan, crop: poovan}
  # vegetables
  - {commodity: tomato, market: Kayamkulam, variety: Other}
  - {commodity: onion, market: Kayamkulam, variety: Big}
  - {commodity: onion, market: Kayamkulam, variety: Small, crop: small_onion}
  - {commodity: onion, market: Palakkad, variety: Small, crop: small_onion}
  - {commodity: green_chilli, market: Kayamkulam, variety: Other}
  - {commodity: drumstick, market: Kayamkulam, variety: Other}
  - {commodity: bitter_gourd, market: Manjeswaram, variety: Bitter Gourd}
  - {commodity: cucumber, market: Payyannur, variety: Other}
