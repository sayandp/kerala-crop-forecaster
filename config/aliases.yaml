# /alert <crop> <market> above|below <Rs/kg>
directions:
  above: [above, over, more, more than, ">", up, rises, മുകളിൽ, കൂടിയാൽ, കൂടുതൽ, കയറിയാൽ, മേലെ]
  below: [below, under, less, less than, "<", down, falls, താഴെ, കുറഞ്ഞാൽ, കുറവ്, താഴ്ന്നാൽ]
