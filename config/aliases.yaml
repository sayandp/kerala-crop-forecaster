    ml: [പാളയങ്കോടൻ, പാളയംകോടൻ, പാളയൻകോടൻ]
    en: [palayankodan, palayamkodan, palayamthodan, palayankodan banana]
  poovan:
    name_en: Poovan banana
    ml: [പൂവൻ, പൂവൻ പഴം]
    en: [poovan, poovan banana, poovan pazham]
  tapioca:
    name_en: Tapioca
    ml: [കപ്പ, മരച്ചീനി, കൊള്ളി, പൂള]
    en: [tapioca, kappa, cassava, maracheeni, kolli, poola]
  tomato:
    name_en: Tomato
    ml: [തക്കാളി]
    en: [tomato, tomatoes, thakkali]
  onion:
    name_en: Onion
    ml: [സവാള, വലിയ ഉള്ളി, ഉള്ളി]
