# Names people type for crops and markets (Telegram bot, Phase 5). Matching is case-insensitive,
# ignores spaces/punctuation and Malayalam ZWJ/ZWNJ / old-style chillu encodings, then falls back
# to fuzzy matching (difflib). The FIRST Malayalam name of each entry is the display name.
# Markets must be markets of config/series.yaml (the served series).
crops:
  # Product keys (config/series.yaml `crop:`, defaults to the commodity). Order = button order,
  # grouped as on the dashboard: cash crops, bananas, vegetables. `name_en` = English display.
  coconut:
    name_en: Coconut
    ml: [തേങ്ങ, നാളികേരം, തെങ്ങ്, നാളികേര]
    en: [coconut, coconuts, thenga, nalikeram]
  pepper:
    name_en: Black pepper
    ml: [കുരുമുളക്, കുരുമുളക്ക്]
    en: [pepper, black pepper, blackpepper, kurumulaku, kurumulak, kurumulagu, milagu]
  rubber:
    name_en: Rubber
    ml: [റബ്ബർ, റബർ, റബ്ബര്, ഷീറ്റ്]
    en: [rubber, rss4, rss-4, rss 4, sheet rubber]
  arecanut:
