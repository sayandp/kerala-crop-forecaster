  coffee:
    name_en: Coffee
    ml: [കാപ്പി, കാപ്പിക്കുരു]
    en: [coffee, kaapi, kappi]
  ginger:
    name_en: Ginger
    ml: [ഇഞ്ചി, പച്ച ഇഞ്ചി]
    en: [ginger, green ginger, inji]
  banana:
    name_en: Nendran banana
    ml: [നേന്ത്രക്കായ, നേന്ത്രൻ, നേന്ത്രപ്പഴം, ഏത്തക്ക, ഏത്തയ്ക്ക, ഏത്തപ്പഴം, ഏത്തവാഴ, വാഴക്കുല, കായ]
