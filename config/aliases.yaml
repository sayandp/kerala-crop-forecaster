  small_onion:
    name_en: Small onion
    ml: [ചെറിയ ഉള്ളി, ചുവന്നുള്ളി, ചുവന്ന ഉള്ളി, കുഞ്ഞുള്ളി]
    en: [small onion, shallot, shallots, sambar onion, cheriya ulli, kunjulli]
  green_chilli:
    name_en: Green chilli
    ml: [പച്ചമുളക്, പച്ച മുളക്]
    en: [green chilli, green chili, chilli, chili, pachamulaku]
  bitter_gourd:
    name_en: Bitter gourd
    ml: [പാവയ്ക്ക, പാവക്ക, കയ്പക്ക]
    en: [bitter gourd, bittergourd, karela, pavakka, pavaykka]
  drumstick:
