name: daily-pipeline

on:
  schedule:
    - cron: "17 14 * * *"  # 14:17 UTC = 19:47 IST (off the hour: GitHub delays on-the-hour crons)
  workflow_dispatch:
    inputs:
      date:
        description: "Run date (YYYY-MM-DD, IST). Empty = today."
        required: false
        default: ""
      steps:
        description: "Comma-separated steps"
        required: false
        default: "ingest,validate,weather"

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: write  # commits status/last_run.json (keeps the cron alive past 60 idle days)

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENV: prod
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tags after v7: pin the exact release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --no-dev

      - name: Run pipeline
        id: pipeline
        env:
          RUN_DATE: ${{ inputs.date }}
          RUN_STEPS: ${{ inputs.steps || 'ingest,validate,weather' }}
        run: |
          args=(--steps "$RUN_STEPS" --status-file status/last_run.json)
          if [ -n "$RUN_DATE" ]; then args+=(--date "$RUN_DATE"); fi
          uv run python -m cropcast.pipeline "${args[@]}"

      - name: Upload logs and raw snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-${{ github.run_id }}
          path: |
            logs/
            data/raw/prices/
            reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit status/last_run.json
        if: always()
        env:
          OUTCOME: ${{ steps.pipeline.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p status
          if [ ! -s status/last_run.json ]; then
            # The pipeline never got far enough to write it (e.g. install failed).
            jq -n --arg s "${OUTCOME:-skipped}" --arg t "$(date -u +%FT%TZ)" \
              '{status: $s, finished_at: $t, note: "no summary from pipeline"}' \
              > status/last_run.json
          fi
          tmp=$(mktemp)
          jq --arg url "$RUN_URL" '. + {run_url: $url}' status/last_run.json > "$tmp"
          mv "$tmp" status/last_run.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/last_run.json
          git commit -m "chore(status): daily run ${OUTCOME:-unknown} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done

      - name: Notify admin if the job itself broke
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ADMIN_CHAT_ID" ]; then
            curl -sS -m 15 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="$TELEGRAM_ADMIN_CHAT_ID" \
              --data-urlencode text="cropcast daily-pipeline job failed: $RUN_URL" > /dev/null
          fi
