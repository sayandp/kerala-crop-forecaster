name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cropcast
          POSTGRES_PASSWORD: cropcast
          POSTGRES_DB: cropcast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cropcast -d cropcast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: ci
      TEST_DATABASE_URL: postgresql+psycopg://cropcast:cropcast@localhost:5432/cropcast_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # pre-registration ordering test reads git history

      # setup-uv publishes no floating major tags after v7: pin the exact release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest -q

  docker:
    # API image: size < 400 MB, starts and answers /health within 20 s under 512 MB RAM.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cropcast
          POSTGRES_PASSWORD: cropcast
          POSTGRES_DB: cropcast
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cropcast -d cropcast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f docker/api.Dockerfile -t cropcast-api:ci .
      - name: Image size < 400 MB
        run: |
          size=$(docker image inspect cropcast-api:ci --format '{{.Size}}')
          mb=$((size / 1024 / 1024))
          echo "image size: ${mb} MB"
          echo "### API image: ${mb} MB" >> "$GITHUB_STEP_SUMMARY"
          test "$mb" -lt 400
      - name: Load schema (so /health does a real DB round trip)
        run: PGPASSWORD=cropcast psql -v ON_ERROR_STOP=1 -h localhost -U cropcast -d cropcast -q -f sql/schema.sql

      # Same as Render: PORT=10000, published port, plain-URL CORS_ORIGINS, 512 MB.
      - name: Cold start < 20 s under 512 MB (PORT=10000)
        run: |
          start=$(date +%s.%N)
          docker run -d --name api --memory=512m -e PORT=10000 -p 10000:10000             --add-host=host.docker.internal:host-gateway             -e CORS_ORIGINS=https://kerala-crop-forecaster.vercel.app             -e DATABASE_URL_RO=postgresql://cropcast:cropcast@host.docker.internal:5432/cropcast             cropcast-api:ci
          for i in $(seq 1 200); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:10000/health || true)
            if [ "$code" != "000" ]; then break; fi
            sleep 0.1
          done
          secs=$(echo "$(date +%s.%N) - $start" | bc)
          echo "first /health response after ${secs}s (HTTP $code): $(cat /tmp/health.json)"
          echo "### API cold start: ${secs}s (HTTP $code), PORT=10000, memory limit 512 MB" >> "$GITHUB_STEP_SUMMARY"
          docker stats --no-stream api
          docker logs api | tail -20
          test "$code" = "200"
          grep -q '"db_ok":true' /tmp/health.json
          awk "BEGIN { exit !($secs < 20) }"

      # Neon unreachable / blackholed: /health must still answer 200 within ~8 s (db_ok=false).
      - name: /health within 10 s when the DB hangs
        run: |
          docker run -d --name api_nodb --memory=512m -e PORT=10000 -p 10001:10000             -e DATABASE_URL_RO=postgresql://u:p@10.255.255.1:5432/none cropcast-api:ci
          for i in $(seq 1 100); do curl -s -o /dev/null http://127.0.0.1:10001/docs && break; sleep 0.1; done
          out=$(curl -s -m 10 -w ' HTTP %{http_code} in %{time_total}s' http://127.0.0.1:10001/health)
          echo "$out"
          echo "### /health with unreachable DB: $out" >> "$GITHUB_STEP_SUMMARY"
          echo "$out" | grep -q 'HTTP 200' && echo "$out" | grep -q '"db_ok":false'
          docker stats --no-stream api_nodb

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.9.1

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # No DATABASE_URL_RO in CI: pages build with empty states (filled by ISR on Vercel).
      - name: Build
        run: pnpm build
