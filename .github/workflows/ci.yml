name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cropcast
          POSTGRES_PASSWORD: cropcast
          POSTGRES_DB: cropcast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cropcast -d cropcast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: ci
      TEST_DATABASE_URL: postgresql+psycopg://cropcast:cropcast@localhost:5432/cropcast_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # pre-registration ordering test reads git history

      # setup-uv publishes no floating major tags after v7: pin the exact release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest -q
