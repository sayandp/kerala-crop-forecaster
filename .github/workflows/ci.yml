name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cropcast
          POSTGRES_PASSWORD: cropcast
          POSTGRES_DB: cropcast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cropcast -d cropcast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: ci
      TEST_DATABASE_URL: postgresql+psycopg://cropcast:cropcast@localhost:5432/cropcast_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # pre-registration ordering test reads git history

      # setup-uv publishes no floating major tags after v7: pin the exact release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest -q

  docker:
    # API image: size < 400 MB, starts and answers /health within 20 s under 512 MB RAM.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cropcast
          POSTGRES_PASSWORD: cropcast
          POSTGRES_DB: cropcast
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cropcast -d cropcast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f docker/api.Dockerfile -t cropcast-api:ci .
      - name: Image size < 400 MB
        run: |
          size=$(docker image inspect cropcast-api:ci --format '{{.Size}}')
          mb=$((size / 1024 / 1024))
          echo "image size: ${mb} MB"
          echo "### API image: ${mb} MB" >> "$GITHUB_STEP_SUMMARY"
          test "$mb" -lt 400
      - name: Cold start < 20 s under 512 MB
        run: |
          start=$(date +%s.%N)
          docker run -d --name api --memory=512m --network host -e PORT=8000 \
            -e DATABASE_URL_RO=postgresql://cropcast:cropcast@localhost:5432/cropcast cropcast-api:ci
          for i in $(seq 1 200); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health || true)
            if [ "$code" != "000" ]; then break; fi
            sleep 0.1
          done
          secs=$(echo "$(date +%s.%N) - $start" | bc)
          echo "first /health response after ${secs}s (HTTP $code)"
          echo "### API cold start: ${secs}s (HTTP $code), memory limit 512 MB" >> "$GITHUB_STEP_SUMMARY"
          docker stats --no-stream api
          test "$code" != "000"
          awk "BEGIN { exit !($secs < 20) }"

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.9.1

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # No DATABASE_URL_RO in CI: pages build with empty states (filled by ISR on Vercel).
      - name: Build
        run: pnpm build
