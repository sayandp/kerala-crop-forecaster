name: deploy

# Deploy the API to Render after CI succeeds on main (Render autoDeploy is off).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret not set - skipping deploy"
            exit 0
          fi
          # Tolerate paste artefacts (quotes, spaces, newlines); never echo the value.
          HOOK=$(printf '%s' "$HOOK" | tr -d '[:space:]"'"'")
          case "$HOOK" in
            https://api.render.com/deploy/srv-*\?key=*) ;;
            *)
              echo "::error::RENDER_DEPLOY_HOOK must be the full Deploy Hook URL from Render (Settings > Deploy Hook): https://api.render.com/deploy/srv-...?key=... (stored value: ${#HOOK} chars, starts with https:// = $(case "$HOOK" in https://*) echo yes;; *) echo no;; esac))"
              exit 1
              ;;
          esac
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$HOOK")
          echo "Render deploy hook: HTTP $code for ${{ github.event.workflow_run.head_sha }}"
          echo "### Render deploy hook: HTTP $code (${{ github.event.workflow_run.head_sha }})" >> "$GITHUB_STEP_SUMMARY"
          case "$code" in 2??) ;; *) exit 1 ;; esac
