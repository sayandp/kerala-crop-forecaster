[project]
name = "cropcast"
version = "0.1.0"
description = "Self-retraining MLOps system forecasting daily Kerala mandi crop prices"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pandera>=0.20",
    "httpx>=0.27",
    "tenacity>=8.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pyarrow>=16",
    "mlflow>=3.16.1",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.1",
    "optuna>=5.0.0",
    "matplotlib>=3.11.2",
    "statsmodels>=0.15.0",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "slowapi>=0.1.10",
    "evidently>=0.7.23",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cropcast"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*", "statsmodels", "statsmodels.*", "scipy", "scipy.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["db: tests that need a reachable Postgres (DATABASE_URL)"]
