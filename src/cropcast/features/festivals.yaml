# Festival dates (Kerala observance) for the window flags in features/build.py.
# A flag is 1 when the TARGET date is within [festival - 14 days, festival].
# Islamic festivals follow local moon sighting; Kerala often observes them a day earlier
# than the rest of India. A one-day error barely matters for a 15-day window flag.
#
# Verification (2026-10-07):
#   onam  2026-08-26, 2027-09-12  drikpanchang.com (Thiruvonam)
#   vishu 2023..2027              officeholidays.com (Kerala)
#   ramzan 2025-03-31, 2026-03-20  Kerala moon-sighting news (Deshabhimani); 2027 = projected
#   bakrid 2020..2026             drikpanchang.com / Kerala GAD holiday notification (2026-05-27)
#   others: Kerala Government holiday lists as known; marked "list" below.
#   2027 Islamic dates are astronomical projections — re-check when announced.

