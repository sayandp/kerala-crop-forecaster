# Bot texts, English. Same keys and placeholders as ml.yaml.
footer: "ഉറവിടം: Agmarknet · ഉറപ്പല്ല / not a guarantee"
start: |-
  Hello! 🌾 Kerala market price bot.

  Latest wholesale (mandi) prices of Kerala cash crops, bananas and vegetables, and the price expected in 7 days.

  • /price — check prices
  • /alert — get told when a price crosses a level
  • /subscribe — a daily price message
  • /help — all commands

  Channel: {channel}
  Website: {dashboard}

  Language / ഭാഷ:
help: |-
  Commands:
  /price <crop> [market] — latest price and the 7-day expected range
  /markets <crop> — markets with fresh prices
  /alert <crop> <market> above|below <₹/kg> — alert when the price crosses it (max {max})
  /alerts — your alerts · /stop <id> · /stopall
  /subscribe <crop> — daily price message · /unsubscribe <crop>
  /lang en|ml — change language
  /about — how it works
  /deletedata — delete all your data

  Example: /price banana kayamkulam · /alert tapioca perumbavoor above 40
  Send just /price or /alert to pick with buttons.
about: |-
  How it works:
  • Every evening we collect Kerala wholesale (mandi) prices from Agmarknet (₹/quintal ÷ 100 = ₹/kg).
  • Our forecast for 7 days ahead is "today's price": in two years of back-tests no machine-learning model beat it. The model only supplies the range (p10–p90): about 8 times in 10 the price should land inside it.
  • Price alerts use real prices only, never the model.
  • Not a guarantee. Check your local market before selling.
  • We store only your chat id, language, alerts and subscriptions — no name or phone number. /deletedata erases everything.
  Accuracy: {dashboard}/en/accuracy · Code: {repo}
