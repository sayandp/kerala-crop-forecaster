footer: "ഉറവിടം: Agmarknet · ഉറപ്പല്ല / not a guarantee"
start: |-
  നമസ്കാരം! 🌾 കേരള വിപണി വില ബോട്ട്.

  നേന്ത്രക്കായ, തേങ്ങ, കുരുമുളക്, റബ്ബർ, കപ്പ എന്നിവയുടെ ഏറ്റവും പുതിയ മൊത്തവിപണി വിലയും 7 ദിവസത്തിനു ശേഷം പ്രതീക്ഷിക്കാവുന്ന വിലയും ഇവിടെ അറിയാം.

  • /price — വില നോക്കാം
  • /alert — വില ഒരു നിശ്ചിത തുക കടന്നാൽ അറിയിപ്പ്
  • /subscribe — എല്ലാ ദിവസവും വില സന്ദേശം
  • /help — എല്ലാ കമാൻഡുകളും

  ചാനൽ: {channel}
  വെബ്സൈറ്റ്: {dashboard}

  Language / ഭാഷ:
help: |-
  കമാൻഡുകൾ:
  /price <വിള> [വിപണി] — ഏറ്റവും പുതിയ വിലയും 7 ദിവസത്തെ പ്രതീക്ഷിത പരിധിയും
  /markets <വിള> — പുതിയ വിലയുള്ള വിപണികൾ
  /alert <വിള> <വിപണി> above|below <₹/കിലോ> — വില ആ തുക കടന്നാൽ അറിയിപ്പ് (പരമാവധി {max})
  /alerts — നിങ്ങളുടെ അറിയിപ്പുകൾ · /stop <നമ്പർ> · /stopall
  /subscribe <വിള> — ദിവസേന വില സന്ദേശം · /unsubscribe <വിള>
  /lang en|ml — ഭാഷ മാറ്റാം
  /about — ഇത് എങ്ങനെ പ്രവർത്തിക്കുന്നു
  /deletedata — നിങ്ങളുടെ എല്ലാ വിവരങ്ങളും മായ്ക്കാം

  ഉദാഹരണം: /price നേന്ത്രൻ കായംകുളം · /alert കപ്പ പെരുമ്പാവൂർ above 40
  ടൈപ്പ് ചെയ്യാതെ /price, /alert എന്നിവ മാത്രം അയച്ചാൽ ബട്ടണുകൾ വരും.
about: |-
  ഇത് എങ്ങനെ പ്രവർത്തിക്കുന്നു:
  • എല്ലാ വൈകുന്നേരവും Agmarknet-ൽ നിന്ന് കേരളത്തിലെ മൊത്തവിപണി വില (₹/ക്വിന്റൽ ÷ 100 = ₹/കിലോ) ശേഖരിക്കുന്നു.
  • 7 ദിവസത്തിനു ശേഷമുള്ള വില "ഇന്നത്തെ വില തന്നെ" എന്നാണ് ഞങ്ങളുടെ പ്രവചനം: രണ്ടു വർഷത്തെ പരിശോധനയിൽ മെഷീൻ ലേണിംഗ് മോഡലുകൾ ഇതിനെക്കാൾ മെച്ചപ്പെട്ടില്ല. മോഡൽ നൽകുന്നത് പരിധി (p10–p90) മാത്രം: 10-ൽ ഏകദേശം 8 തവണ വില അതിനുള്ളിൽ വരണം.
  • വില അറിയിപ്പുകൾ യഥാർത്ഥ വിലയെ മാത്രം ആശ്രയിക്കുന്നു, മോഡലിനെ അല്ല.
  • ഇത് ഉറപ്പല്ല. വിൽക്കും മുമ്പ് പ്രാദേശിക വിപണിയിൽ ഉറപ്പാക്കുക.
  • ഞങ്ങൾ സൂക്ഷിക്കുന്നത് chat id, ഭാഷ, അറിയിപ്പുകൾ, സബ്സ്ക്രിപ്ഷനുകൾ എന്നിവ മാത്രം; പേരോ ഫോൺ നമ്പറോ ഇല്ല. /deletedata എല്ലാം മായ്ക്കും.
