# Render blueprint: cropcast API (free web service). Deploys are triggered by
# .github/workflows/deploy.yml (deploy hook) after CI passes on main — autoDeploy is off.
services:
  - type: web
    name: cropcast-api
    runtime: docker
    dockerfilePath: docker/api.Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL_RO          # read-only role cropcast_ro (set in the dashboard)
        sync: false
      - key: DATABASE_URL_BOT         # bot writes: role cropcast_bot (scripts/setup_bot_role.py)
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET  # same value as in .env (scripts/set_webhook.py)
        sync: false
      - key: CORS_ORIGINS
        value: https://kerala-crop-forecaster.vercel.app
      - key: ENV
        value: prod
